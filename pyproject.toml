[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "huion"
version = "0.2.1"
description = "Convert local Huion note backups into AI-enriched Obsidian notes"
requires-python = ">=3.9"

[project.scripts]
huion = "ink2vault.cli:main"

[tool.setuptools.packages.find]
include = ["ink2vault*"]
