name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-main
  cancel-in-progress: true

jobs:
  push_to_registry:
    name: Build and push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push latest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ink2vault:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push OCR image
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/moravianlibrary/TuzkaOCR.git#060effdb0de45b67df1a38d7db8fd562bedd8cb4
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ink2vault:ocr-latest
          labels: |
            org.opencontainers.image.source=https://github.com/moravianlibrary/TuzkaOCR
            org.opencontainers.image.licenses=CC-BY-NC-SA-4.0
          cache-from: type=gha,scope=ocr
          cache-to: type=gha,mode=max,scope=ocr

      - name: Build and push CouchDB image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy
          file: ./deploy/couchdb.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ink2vault:couchdb-latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=couchdb
          cache-to: type=gha,mode=max,scope=couchdb
